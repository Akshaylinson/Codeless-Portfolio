<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Codeless Technologies – Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App redirect script
      // Preserves clean React Router URLs on refresh or direct URL navigation
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Codeless Technologies portfolio...</p>
  </body>
</html>
